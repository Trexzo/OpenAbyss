name: OpenAbyss Recovery Source Audit

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/r38-compile-pass
    paths:
      - src/main/java/**
      - tools/recovery_audit.py
      - tools/check_category_probe_coverage.py
      - tools/check_promoted_registry_authority.py
      - tools/promoted-registry-authority.txt
      - .github/workflows/recovery-audit.yml

permissions:
  contents: read

jobs:
  audit:
    name: Whole-source CFR/ZKM damage audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout recovered source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan Java recovery surface
        run: python tools/recovery_audit.py --out build/recovery-audit

      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if [ -f build/recovery-audit/summary.md ]; then
            cat build/recovery-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gate high-confidence recovery findings
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("build/recovery-audit/recovery-audit.json")
          data = json.loads(report.read_text(encoding="utf-8"))
          high = int(data.get("counts_by_confidence", {}).get("high", 0))
          print(f"RECOVERY_AUDIT_HIGH_CONFIDENCE={high}")
          if high != 0:
              raise SystemExit(f"Recovery audit found {high} high-confidence finding(s).")
          print("RECOVERY_AUDIT_HIGH_CONFIDENCE_GATE=PASS")
          PY

      - name: Verify world-session transition ownership
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/main/java/Abyss/AbyssClient.java")
          text = path.read_text(encoding="utf-8")

          increment = "++this.runtimeWorldSessionCount;"
          if text.count(increment) != 1:
              raise SystemExit(
                  f"WORLD_SESSION_INCREMENT_OWNER=FAIL count={text.count(increment)}"
              )

          post = text.find("public void onPostTick")
          join = text.find("public void onEntityJoinWorld")
          increment_at = text.find(increment)
          if post < 0 or join < 0 or increment_at < 0:
              raise SystemExit("WORLD_SESSION_INCREMENT_OWNER=FAIL missing anchors")

          # The entity-join callback must remain observation/cleanup only.
          join_end = text.find("public void onReceivePacket", join)
          if join_end < 0:
              raise SystemExit("WORLD_SESSION_INCREMENT_OWNER=FAIL join end missing")
          join_body = text[join:join_end]
          if "runtimeWorldSessionCount" in join_body or "runtimeWorldSessionActive" in join_body:
              raise SystemExit("WORLD_SESSION_INCREMENT_OWNER=FAIL entity join owns session state")

          # The sole increment must live inside onPostTick's authoritative in-world branch.
          post_end = text.find("private void pumpBedScan", post)
          if post_end < 0 or not (post < increment_at < post_end):
              raise SystemExit("WORLD_SESSION_INCREMENT_OWNER=FAIL increment outside onPostTick")

          required = (
              'if (!this.runtimeWorldSessionActive)',
              'this.runtimeWorldSessionActive = true;',
              'runtimeMilestone("world-session-join:" + this.runtimeWorldSessionCount)',
          )
          window = text[max(post, increment_at - 500): increment_at + 800]
          for token in required:
              if token not in window:
                  raise SystemExit(f"WORLD_SESSION_INCREMENT_OWNER=FAIL missing {token}")

          print("WORLD_SESSION_INCREMENT_OWNER=PASS owner=onPostTick-state-edge")
          PY

      - name: Verify promoted registry authority
        run: python tools/check_promoted_registry_authority.py

      - name: Verify nine-category lifecycle coverage
        run: python tools/check_category_probe_coverage.py

      - name: Upload recovery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAbyss-recovery-source-audit
          path: build/recovery-audit/**
          if-no-files-found: error
          retention-days: 14

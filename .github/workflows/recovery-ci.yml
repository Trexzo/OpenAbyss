      - name: Build standalone Windows launcher package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          & $env:OPENABYSS_GRADLE --no-daemon packageWindowsLauncher
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Resolve-Path '.\build\distributions\OpenAbyss-Windows-Launcher.zip'
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName })
            foreach ($required in @('abyss.jar','BUILD-INFO.txt','Launcher.bat','launch_abyss.ps1','Prepare-Official-Launcher.bat','Prepare-Official-Launcher.ps1','Check-Official-Launcher.bat','Check-Official-Launcher.ps1','README.txt')) {
              if ($names -notcontains $required) { throw "Standalone launcher package missing: $required" }
            }
            $jar = $zip.GetEntry('abyss.jar')
            if ($jar.Length -lt 10000000) { throw "Packaged abyss.jar unexpectedly small: $($jar.Length)" }

            $sha = [System.Security.Cryptography.SHA256]::Create()
            try {
              $jarStream = $jar.Open()
              try {
                $jarHashBytes = $sha.ComputeHash($jarStream)
              }
              finally {
                $jarStream.Dispose()
              }
            }
            finally {
              $sha.Dispose()
            }
            $jarHash = ([BitConverter]::ToString($jarHashBytes)).Replace('-','')

            $infoEntry = $zip.GetEntry('BUILD-INFO.txt')
            if ($null -eq $infoEntry) { throw 'BUILD-INFO.txt is missing from launcher package.' }
            $reader = New-Object System.IO.StreamReader($infoEntry.Open())
            try { $infoText = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $info = @{}
            foreach ($line in ($infoText -split "`r?`n")) {
              if ($line -match '^([^=]+)=(.*)$') {
                $info[$matches[1]] = $matches[2]
              }
            }
            if ($info['SOURCE_HEAD'] -ne $env:GITHUB_SHA) {
              throw "BUILD-INFO SOURCE_HEAD mismatch: $($info['SOURCE_HEAD']) != $env:GITHUB_SHA"
            }
            if ($info['JAR_SHA256'] -ne $jarHash) {
              throw "BUILD-INFO JAR_SHA256 mismatch: $($info['JAR_SHA256']) != $jarHash"
            }
            if ([int64]$info['JAR_BYTES'] -ne $jar.Length) {
              throw "BUILD-INFO JAR_BYTES mismatch: $($info['JAR_BYTES']) != $($jar.Length)"
            }
            Write-Host "WINDOWS_LAUNCHER_PACKAGE_CONTRACT=PASS entries=$($zip.Entries.Count) jar_bytes=$($jar.Length) jar_sha256=$jarHash"
          }
          finally {
            $zip.Dispose()
          }

      - name: Verify canonical shipped JAR content digest
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = (Resolve-Path '.\build\distributions\OpenAbyss-Windows-Launcher.zip').Path
          $out = Join-Path $env:RUNNER_TEMP 'openabyss-content-digest-package-check'
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $package -DestinationPath $out -Force

          $jar = Join-Path $out 'abyss.jar'
          $infoPath = Join-Path $out 'BUILD-INFO.txt'
          $info = @{}
          foreach ($infoLine in @(Get-Content -LiteralPath $infoPath)) {
            $parts = $infoLine -split '=', 2
            if ($parts.Count -eq 2) {
              $info[$parts[0]] = $parts[1]
            }
          }
          if (-not $info.ContainsKey('JAR_CONTENT_SHA256')) {
            throw 'BUILD-INFO.txt is missing JAR_CONTENT_SHA256.'
          }

          $digestOutput = @(& python '.\tools\jar_content_digest.py' $jar)
          if ($LASTEXITCODE -ne 0) {
            $digestOutput | ForEach-Object { Write-Host $_ }
            throw "Canonical JAR content digest tool failed: $LASTEXITCODE"
          }
          $digestOutput | ForEach-Object { Write-Host $_ }
          $digestLine = $digestOutput | Where-Object { $_.StartsWith('JAR_CONTENT_SHA256=') } | Select-Object -First 1
          if (-not $digestLine) { throw 'Canonical JAR content digest output is missing.' }
          $actual = ($digestLine -split '=',2)[1].Trim().ToUpperInvariant()
          $expected = ([string]$info['JAR_CONTENT_SHA256']).Trim().ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "BUILD-INFO JAR_CONTENT_SHA256 mismatch: $expected != $actual"
          }
          Write-Host "WINDOWS_LAUNCHER_CONTENT_DIGEST_CONTRACT=PASS content_sha256=$actual"
          Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue


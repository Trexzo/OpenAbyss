name: OpenAbyss Recovery CI

on:
  push:
    branches:
      - recovery/r38-compile-pass
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openabyss-recovery-ci
  cancel-in-progress: true

jobs:
  recovery-build:
    name: JDK8 / Gradle 2.14.1 / ForgeGradle 2.1
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout recovery source
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Show Java environment
        shell: powershell
        run: |
          java -version
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "RUNNER_TEMP=$env:RUNNER_TEMP"

      - name: Install Gradle 2.14.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'gradle-2.14.1-bin.zip'
          $gradleHome = Join-Path $env:RUNNER_TEMP 'gradle-2.14.1'
          $gradleUserHome = Join-Path $env:RUNNER_TEMP 'gradle-user-home'
          $url = 'https://services.gradle.org/distributions/gradle-2.14.1-bin.zip'
          & curl.exe -L --fail --silent --show-error $url -o $zip
          if ($LASTEXITCODE -ne 0) { throw "curl failed with exit code $LASTEXITCODE" }
          Expand-Archive -LiteralPath $zip -DestinationPath $env:RUNNER_TEMP -Force
          $gradle = Join-Path $gradleHome 'bin\gradle.bat'
          if (-not (Test-Path -LiteralPath $gradle)) { throw "Gradle executable missing: $gradle" }
          "OPENABYSS_GRADLE=$gradle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GRADLE_USER_HOME=$gradleUserHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $gradle --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate physical smoke PowerShell
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @('.\tools\physical-smoke.ps1','.\tools\physical-menu-bisect.ps1','.\tools\physical-usability.ps1','.\tools\prepare-production-forge-profile.ps1','.\launcher\launch_abyss.ps1','.\launcher\Prepare-Official-Launcher.ps1','.\launcher\Check-Official-Launcher.ps1')) {
            $path = (Resolve-Path $relative).Path
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "$relative has $($errors.Count) PowerShell parse error(s)."
            }
            Write-Host "POWERSHELL_PARSE_PASS file=$relative tokens=$($tokens.Count)"
          }

          $physicalSmokeText = [IO.File]::ReadAllText((Resolve-Path '.\tools\physical-smoke.ps1'))
          $physicalUsabilityText = [IO.File]::ReadAllText((Resolve-Path '.\tools\physical-usability.ps1'))
          $probeMatches = [regex]::Matches($physicalSmokeText, 'high-risk-functional-probe(\d+)-pass:')
          if ($probeMatches.Count -eq 0) { throw 'Physical smoke exposes no high-risk functional probe pass markers.' }
          $probeMax = ($probeMatches | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Maximum).Maximum
          $chainName = "ExtendedHighRiskChain$probeMax"
          $probePassMarker = "high-risk-functional-probe$probeMax-pass:"
          $probeFailMarker = "high-risk-functional-probe$probeMax-fail:"
          if (-not $physicalUsabilityText.Contains("$chainName =")) {
            throw "Physical usability checker does not define $chainName for smoke probe max $probeMax."
          }
          if (-not $physicalUsabilityText.Contains('$checks.' + $chainName)) {
            throw "Physical usability final verdict does not consume $chainName."
          }
          if (-not $physicalUsabilityText.Contains($probePassMarker) -or
              -not $physicalUsabilityText.Contains($probeFailMarker)) {
            throw "Physical usability checker does not gate probe $probeMax pass/fail markers."
          }
          Write-Host "PHYSICAL_PROBE_CHAIN_CONSISTENCY_PASS max=$probeMax chain=$chainName"

          if (-not $physicalSmokeText.Contains('$env:JAVA_TOOL_OPTIONS = $null')) {
            throw 'Physical smoke does not explicitly clear JAVA_TOOL_OPTIONS.'
          }
          if (-not $physicalSmokeText.Contains('OPENABYSS_RUNCLIENT_JVM_ARG_FILE')) {
            throw 'Physical smoke does not publish the explicit runClient JVM argument file.'
          }
          $buildGradleText = [IO.File]::ReadAllText((Resolve-Path '.\build.gradle'))
          if (-not $buildGradleText.Contains("System.getenv('OPENABYSS_RUNCLIENT_JVM_ARG_FILE')")) {
            throw 'build.gradle does not consume the physical explicit JVM argument file.'
          }

          $jvmArgFixture = Join-Path $env:RUNNER_TEMP 'openabyss-runclient-jvm-args.txt'
          @(
            '-Dabyss.runtimeSelfTest=true'
            '-Dabyss.highRiskFunctionalProbe93=true'
            '-Dabyss.commandRuntimeProbe=true'
          ) | Set-Content -LiteralPath $jvmArgFixture -Encoding ascii
          $env:OPENABYSS_RUNCLIENT_JVM_ARG_FILE = $jvmArgFixture
          try {
            $jvmArgStdout = Join-Path $env:RUNNER_TEMP 'openabyss-jvm-arg-fixture.stdout.log'
            $jvmArgStderr = Join-Path $env:RUNNER_TEMP 'openabyss-jvm-arg-fixture.stderr.log'
            $jvmArgProcess = Start-Process -FilePath $env:OPENABYSS_GRADLE -ArgumentList @('--offline','--no-daemon','--stacktrace','help') -WorkingDirectory $env:GITHUB_WORKSPACE -RedirectStandardOutput $jvmArgStdout -RedirectStandardError $jvmArgStderr -Wait -PassThru
            $jvmArgOutput = ((Get-Content -LiteralPath $jvmArgStdout -Raw -ErrorAction SilentlyContinue) + [Environment]::NewLine + (Get-Content -LiteralPath $jvmArgStderr -Raw -ErrorAction SilentlyContinue))
            if ($jvmArgProcess.ExitCode -ne 0) {
              Write-Host $jvmArgOutput
              throw "Explicit runClient JVM argument Gradle fixture failed: $($jvmArgProcess.ExitCode)"
            }
            if (-not $jvmArgOutput.Contains('ABYSS_RUNCLIENT_EXPLICIT_JVM_ARGS=3')) {
              Write-Host $jvmArgOutput
              throw 'Gradle did not attach all explicit runClient JVM arguments from the fixture.'
            }
            Write-Host 'PHYSICAL_EXPLICIT_JVM_ARG_FILE_CONTRACT=PASS count=3'
          }
          finally {
            Remove-Item Env:\OPENABYSS_RUNCLIENT_JVM_ARG_FILE -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $jvmArgFixture -Force -ErrorAction SilentlyContinue
          }

          $currentHead = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $currentHead) { throw 'Could not resolve CI checkout HEAD.' }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\physical-usability.ps1' -ExpectedHead $currentHead -SourceGuardOnly
          if ($LASTEXITCODE -ne 0) { throw "Physical source guard rejected the exact clean CI HEAD: $LASTEXITCODE" }

          $wrongHead = '0000000000000000000000000000000000000000'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\physical-usability.ps1' -ExpectedHead $wrongHead -SourceGuardOnly
          if ($LASTEXITCODE -eq 0) { throw 'Physical source guard accepted an intentionally wrong HEAD.' }
          Write-Host 'PHYSICAL_SOURCE_GUARD_WRONG_HEAD_REJECT=PASS'

          Add-Content -LiteralPath '.\README.md' -Value '<!-- physical-source-guard-dirty-fixture -->'
          try {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\tools\physical-usability.ps1' -ExpectedHead $currentHead -SourceGuardOnly
            if ($LASTEXITCODE -eq 0) { throw 'Physical source guard accepted an intentionally dirty tracked tree.' }
            Write-Host 'PHYSICAL_SOURCE_GUARD_DIRTY_REJECT=PASS'
          }
          finally {
            & git checkout -- '.\README.md'
            if ($LASTEXITCODE -ne 0) { throw 'Could not restore README.md after dirty-tree source-guard fixture.' }
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File '.\launcher\launch_abyss.ps1' -ResolverSelfTest
          if ($LASTEXITCODE -ne 0) { throw "Standalone launcher resolver self-test failed: $LASTEXITCODE" }

          $checkerFixture = Join-Path $env:RUNNER_TEMP 'openabyss-official-checker-selftest'
          New-Item -ItemType Directory -Force -Path $checkerFixture | Out-Null
          Copy-Item -LiteralPath '.\launcher\Check-Official-Launcher.ps1' -Destination $checkerFixture -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $checkerFixture 'Check-Official-Launcher.ps1') -PackageDir $checkerFixture -FixtureSelfTest
          if ($LASTEXITCODE -ne 0) { throw "Official usability checker self-test failed: $LASTEXITCODE" }
          Remove-Item -LiteralPath $checkerFixture -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify recovered account state contract

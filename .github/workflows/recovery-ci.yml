        run: |
          $ErrorActionPreference = 'Continue'
          & $env:OPENABYSS_GRADLE --no-daemon clean build
          $code = $LASTEXITCODE
          if ($code -ne 0) { exit $code }

      - name: Verify production Forge reobfuscation

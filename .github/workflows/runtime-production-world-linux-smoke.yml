name: OpenAbyss Linux Production World Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/r38-compile-pass
    paths:
      - .github/workflows/runtime-production-world-linux-smoke.yml
      - src/main/java/Abyss/**
      - src/main/java/com/formdev/flatlaf/**
      - src/main/resources/**
      - launcher/**
      - tools/production_forge_linux.py
      - tools/run_production_world_smoke.sh
      - build.gradle

permissions:
  contents: read

concurrency:
  group: openabyss-linux-production-world-runtime-smoke
  cancel-in-progress: true

jobs:
  linux-production-world-runtime:
    name: Production reobf JAR / normal Forge / local world / RSHIFT
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout recovery source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install graphics and network-isolation runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils x11-xserver-utils x11-utils xdotool openbox scrot imagemagick \
            libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxinerama1 libxcursor1 libxxf86vm1 \
            iproute2 util-linux

      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gradle-2.14.1-bin.zip"
          HOME_DIR="$RUNNER_TEMP/gradle-2.14.1"
          USER_HOME="$RUNNER_TEMP/gradle-user-home-production-world"
          rm -f "$ZIP"
          curl -L --fail --silent --show-error \
            --retry 6 --retry-delay 2 --retry-max-time 90 --retry-all-errors \
            'https://services.gradle.org/distributions/gradle-2.14.1-bin.zip' \
            -o "$ZIP"
          test -s "$ZIP"
          unzip -tq "$ZIP" >/dev/null
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP"
          GRADLE="$HOME_DIR/bin/gradle"
          test -x "$GRADLE"
          echo "OPENABYSS_GRADLE=$GRADLE" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$USER_HOME" >> "$GITHUB_ENV"
          "$GRADLE" --version

      - name: Build exact shipped production package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/production_forge_linux.py
          bash -n tools/run_production_world_smoke.sh

          build_ok=0
          for attempt in 1 2 3; do
            echo "PRODUCTION_WORLD_BUILD_ATTEMPT=$attempt"
            if "$OPENABYSS_GRADLE" --no-daemon clean packageWindowsLauncher; then
              build_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$build_ok" -ne 1 ]; then
            echo "PRODUCTION_WORLD_BUILD_RETRIES_EXHAUSTED=1" >&2
            exit 1
          fi

          PACKAGE="$GITHUB_WORKSPACE/build/distributions/OpenAbyss-Windows-Launcher.zip"
          OUT="$RUNNER_TEMP/openabyss-production-world-package"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$PACKAGE" -d "$OUT"

          test -s "$OUT/abyss.jar"
          test -s "$OUT/BUILD-INFO.txt"
          JAR_HASH="$(sha256sum "$OUT/abyss.jar" | awk '{print toupper($1)}')"
          INFO_HASH="$(grep '^JAR_SHA256=' "$OUT/BUILD-INFO.txt" | cut -d= -f2- | tr '[:lower:]' '[:upper:]')"
          test "$JAR_HASH" = "$INFO_HASH"

          echo "OPENABYSS_PRODUCTION_WORLD_PACKAGE=$OUT" >> "$GITHUB_ENV"
          echo "OPENABYSS_PRODUCTION_WORLD_JAR=$OUT/abyss.jar" >> "$GITHUB_ENV"
          echo "PRODUCTION_WORLD_SHIPPED_JAR_SHA256=$JAR_HASH"

      - name: Prepare normal Forge profile, official assets, and local server
        shell: bash
        run: |
          set -euo pipefail
          MC="$RUNNER_TEMP/openabyss-production-world-minecraft"
          rm -rf "$MC"
          python tools/production_forge_linux.py prepare \
            --minecraft-dir "$MC" \
            --download-assets

          grep -Fq 'OPENABYSS_PRODUCTION_FORGE_PROFILE=READY' "$MC/openabyss-production-profile.txt"
          cat "$MC/openabyss-production-profile.txt"
          echo "OPENABYSS_PRODUCTION_WORLD_MC=$MC" >> "$GITHUB_ENV"

          SERVER_JAR="$RUNNER_TEMP/minecraft_server.1.8.9.jar"
          python - "$SERVER_JAR" <<'PY'
          import hashlib, json, sys, urllib.request
          output = sys.argv[1]
          manifest = json.load(urllib.request.urlopen(
              'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',
              timeout=30,
          ))
          entry = next(v for v in manifest['versions'] if v['id'] == '1.8.9')
          version = json.load(urllib.request.urlopen(entry['url'], timeout=30))
          server = version['downloads']['server']
          with urllib.request.urlopen(server['url'], timeout=60) as response:
              data = response.read()
          actual = hashlib.sha1(data).hexdigest()
          if actual.lower() != server['sha1'].lower():
              raise SystemExit('SERVER_SHA1_MISMATCH expected=%s actual=%s' % (server['sha1'], actual))
          open(output, 'wb').write(data)
          print('MINECRAFT_SERVER_1_8_9_SHA1=' + actual.upper())
          print('MINECRAFT_SERVER_1_8_9_BYTES=' + str(len(data)))
          PY
          test -s "$SERVER_JAR"
          echo "OPENABYSS_SERVER_JAR=$SERVER_JAR" >> "$GITHUB_ENV"

      - name: Start Mesa X server
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
            >"$RUNNER_TEMP/openabyss-production-world-xvfb.log" 2>&1 &
          echo "OPENABYSS_XVFB_PID=$!" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null

          DISPLAY=:99 openbox >"$RUNNER_TEMP/openabyss-production-world-openbox.log" 2>&1 &
          echo "OPENABYSS_OPENBOX_PID=$!" >> "$GITHUB_ENV"
          sleep 2

          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | tee "$RUNNER_TEMP/openabyss-production-world-glxinfo.txt"
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | grep -Eq 'OpenGL renderer string:.*(llvmpipe|softpipe|Mesa)'
          echo 'PRODUCTION_WORLD_MESA=PASS'

      - name: Run shipped production JAR with no external network
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_production_world_smoke.sh

          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"

          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            ip link add abyss-dummy type dummy
            ip addr add 192.0.2.1/32 dev abyss-dummy
            ip link set abyss-dummy up
            test -z "$(ip route show default)"

            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env \
                HOME="$3" \
                DISPLAY=:99 \
                JAVA_HOME="$4" \
                PATH="$4/bin:$5" \
                GITHUB_WORKSPACE="$6" \
                RUNNER_TEMP="$7" \
                OPENABYSS_SERVER_JAR="$8" \
                OPENABYSS_PRODUCTION_WORLD_MC="$9" \
                OPENABYSS_PRODUCTION_WORLD_JAR="${10}" \
                LIBGL_ALWAYS_SOFTWARE=1 \
                JAVA_TOOL_OPTIONS="-Dabyss.runtimeSelfTest=true -Dabyss.worldFunctionalProbe=true -Dabyss.categoryLifecycleProbe=true -Dabyss.promotedRegistryProbe=true -Dabyss.eventFunctionalProbe=true -Dabyss.movementFunctionalProbe=true -Dabyss.playerFunctionalProbe=true -Dabyss.combatFunctionalProbe=true -Dabyss.packetFunctionalProbe=true -Dabyss.macroFunctionalProbe=true -Dabyss.visualUtilityFunctionalProbe=true -Dabyss.highRiskFunctionalProbe=true -Dabyss.highRiskFunctionalProbe2=true -Dabyss.physicalInputFunctionalProbe=true -Dabyss.highRiskFunctionalProbe3=true -Dabyss.highRiskFunctionalProbe4=true -Dabyss.invMovePhysicalProbe=true -Dabyss.commandRuntimeProbe=true -Dabyss.networkCommandProbe=true -Dabyss.clickGuiModeProbe=true" \
                GITHUB_TOKEN= \
                ACTIONS_RUNTIME_TOKEN= \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
                ACTIONS_ID_TOKEN_REQUEST_URL= \
                ABYSS_PAYLOAD_KEY= \
                bash "$6/tools/run_production_world_smoke.sh"
          ' _ \
            "$RUNNER_UID" "$RUNNER_GID" "$HOME" "$JAVA_HOME" "$PATH" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$OPENABYSS_SERVER_JAR" \
            "$OPENABYSS_PRODUCTION_WORLD_MC" "$OPENABYSS_PRODUCTION_WORLD_JAR"

      - name: Validate and stage production-world evidence
        shell: bash
        run: |
          set -euo pipefail
          GAME="$RUNNER_TEMP/openabyss-production-world-game"
          STAGE="$GAME/abyss-runtime-stage.txt"
          STDOUT="$RUNNER_TEMP/openabyss-production-world-client.stdout.log"
          SCREENSHOT="$RUNNER_TEMP/openabyss-production-world-clickgui.png"

          test -f "$STAGE"
          grep -Fq 'menu-no-world-tick' "$STAGE"
          grep -Fq 'menu-cleanup-complete:packetBuffer=false:u=0:v=0:a=0' "$STAGE"
          echo 'PRODUCTION_WORLD_MENU_LIFECYCLE=PASS'
          echo 'PRODUCTION_WORLD_MENU_PACKET_CLEANUP=PASS'
          grep -Fq 'entity-player-join-world' "$STAGE"
          grep -Fq 'world-ready-tick' "$STAGE"
          grep -Fq 'world-module-lifecycle-complete' "$STAGE"
          NETWORK_STAGE="$GAME/abyss-network-stage.txt"
          test -f "$NETWORK_STAGE"
          grep -Fq 'send-hook:' "$NETWORK_STAGE"
          grep -Fq 'receive-hook:' "$NETWORK_STAGE"
          grep -Fq 'world-functional-probe-pass' "$STAGE"
          grep -Fq 'category-lifecycle-probe-pass:9' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Velocity' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:NoSlow' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Blink' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Speed' "$STAGE"
          grep -Fq 'high-risk-functional-probe-pass:4' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL=PASS modules=Velocity,NoSlow,Blink,Speed'
          grep -Fq 'high-risk-functional-probe2-module-pass:Sprint' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-module-pass:BackTrack' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-module-pass:NoInteract' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-pass:3' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL2=PASS modules=Sprint,BackTrack,NoInteract'
          grep -Fq 'physical-input-functional-probe-effect-pass:AutoClicker:physicalAttack=true' "$STAGE"
          grep -Fq 'physical-input-functional-probe-effect-pass:FastFall:motionY=' "$STAGE"
          grep -Fq 'physical-input-functional-probe-pass:2' "$STAGE"
          echo 'PRODUCTION_WORLD_PHYSICAL_INPUT_FUNCTIONAL=PASS modules=AutoClicker,FastFall'
          grep -Fq 'high-risk-functional-probe3-effect-pass:WTap:forward=0.0:strafe=0.0' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-restore-pass:WTap' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-module-pass:WTap' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL3=PASS modules=WTap'
          grep -Fq 'high-risk-functional-probe4-effect-pass:ChestESP:visible=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-effect-pass:ChestESP:ignoreOpened=true:hidden=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-restore-pass:ChestESP' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-module-pass:ChestESP' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL4=PASS modules=ChestESP'
          grep -Fq 'invmove-physical-probe-inventory-open' "$STAGE"
          grep -Fq 'invmove-physical-probe-input-seen:forward=true' "$STAGE"
          grep -Fq 'invmove-physical-probe-effect-pass:forwardBinding=true:screen=GuiInventory' "$STAGE"
          grep -Fq 'invmove-physical-probe-close-effect-pass:forwardBinding=false' "$STAGE"
          grep -Fq 'invmove-physical-probe-restore-pass:' "$STAGE"
          grep -Fq 'invmove-physical-probe-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_INVMOVE_PHYSICAL=PASS input=real-E-plus-W'
          grep -Fq 'promoted-registry-probe-pass:20' "$STAGE"
          PROMOTED_MODULE_PASSES="$(grep -Fc 'promoted-registry-probe-module-pass:' "$STAGE" || true)"
          test "$PROMOTED_MODULE_PASSES" -eq 20
          if grep -Fq 'promoted-registry-probe-fail:' "$STAGE"; then
            echo 'Promoted-registry lifecycle probe reported a failure.'
            grep -F 'promoted-registry-probe-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_PROMOTED_REGISTRY_PROBE=PASS modules=20'
          grep -Fq 'event-functional-probe-dispatch:FastPlace:rightClickDelay=4' "$STAGE"
          grep -Fq 'event-functional-probe-effect-pass:FastPlace:rightClickDelay=1' "$STAGE"
          grep -Fq 'event-functional-probe-restore-state-pass:FastPlace' "$STAGE"
          grep -Fq 'event-functional-probe-pass:FastPlace:' "$STAGE"
          echo 'PRODUCTION_WORLD_FASTPLACE_EVENT_EFFECT=PASS'
          grep -Fq 'movement-functional-probe-dispatch:NoJumpDelay:jumpTicks=7' "$STAGE"
          grep -Fq 'movement-functional-probe-effect-pass:NoJumpDelay:jumpTicks=1' "$STAGE"
          grep -Fq 'movement-functional-probe-restore-state-pass:NoJumpDelay' "$STAGE"
          grep -Fq 'movement-functional-probe-pass:NoJumpDelay:' "$STAGE"
          echo 'PRODUCTION_WORLD_NOJUMPDELAY_EVENT_EFFECT=PASS'
          grep -Fq 'player-functional-probe-dispatch:NoHitDelay:leftClickCounter=7' "$STAGE"
          grep -Fq 'player-functional-probe-effect-pass:NoHitDelay:leftClickCounter=0' "$STAGE"
          grep -Fq 'player-functional-probe-restore-state-pass:NoHitDelay' "$STAGE"
          grep -Fq 'player-functional-probe-pass:NoHitDelay:' "$STAGE"
          echo 'PRODUCTION_WORLD_NOHITDELAY_CLICK_EFFECT=PASS'
          grep -Fq 'combat-functional-probe-dispatch:KeepSprint:motion=1.25,-0.75:slowdown=50' "$STAGE"
          grep -Fq 'combat-functional-probe-effect-pass:KeepSprint:motion=1.0,-0.6:sprinting=true' "$STAGE"
          grep -Fq 'combat-functional-probe-restore-state-pass:KeepSprint' "$STAGE"
          grep -Fq 'combat-functional-probe-pass:KeepSprint:' "$STAGE"
          echo 'PRODUCTION_WORLD_KEEP_SPRINT_HOOK_EFFECT=PASS'
          grep -Fq 'packet-functional-probe-dispatch:Ambience:S03PacketTimeUpdate' "$STAGE"
          grep -Fq 'packet-functional-probe-effect-pass:Ambience:S03PacketTimeUpdate:cancelled=true' "$STAGE"
          grep -Fq 'render-functional-probe-dispatch:Ambience:worldTime=1234' "$STAGE"
          grep -Fq 'render-functional-probe-effect-pass:Ambience:worldTime=6000' "$STAGE"
          grep -Fq 'render-functional-probe-worldtime-restore-pass:Ambience' "$STAGE"
          grep -Fq 'packet-functional-probe-restore-state-pass:Ambience' "$STAGE"
          grep -Fq 'packet-functional-probe-pass:Ambience:' "$STAGE"
          echo 'PRODUCTION_WORLD_AMBIENCE_PACKET_CANCEL=PASS'
          echo 'PRODUCTION_WORLD_AMBIENCE_RENDER_EFFECT=PASS'
          grep -Fq 'macro-functional-probe-dispatch:Macro1:CHAT:OPENABYSS_MACRO_PROBE_7E51' "$STAGE"
          grep -Fq 'macro-functional-probe-packet-buffer:false' "$STAGE"
          grep -Fq 'macro-functional-probe-client-send-pass:Macro1:OPENABYSS_MACRO_PROBE_7E51' "$STAGE"
          grep -Fq 'macro-functional-probe-restore-state-pass:Macro1' "$STAGE"
          grep -Fq 'macro-functional-probe-pass:Macro1:' "$STAGE"
          grep -Fq 'chat-send-probe-payload:true' "$NETWORK_STAGE"
          grep -Fq 'chat-send-decision:accepted' "$NETWORK_STAGE"
          grep -Fq 'chat-receive-probe-echo:true' "$NETWORK_STAGE"
          if grep -Fq 'chat-buffered:PacketManager' "$NETWORK_STAGE"; then
            echo 'Macro1 synthetic chat was unexpectedly buffered by PacketManager.'
            cat "$NETWORK_STAGE"
            exit 1
          fi
          grep -Fq 'OPENABYSS_MACRO_PROBE_7E51' "$RUNNER_TEMP/openabyss-production-world-server.log"
          echo 'PRODUCTION_WORLD_MACRO1_CHAT_CLIENT=PASS'
          echo 'PRODUCTION_WORLD_MACRO1_CHAT_SERVER_RECEIPT=PASS'
          echo 'PRODUCTION_WORLD_MACRO1_CHAT_ROUNDTRIP=PASS'
          grep -Fq 'visual-utility-functional-probe-effect-pass:InventoryHUD:cache0=stone*3' "$STAGE"
          grep -Fq 'visual-utility-functional-probe-restore-state-pass:InventoryHUD' "$STAGE"
          grep -Fq 'visual-utility-functional-probe-pass:InventoryHUD:' "$STAGE"
          echo 'PRODUCTION_WORLD_INVENTORYHUD_NATURAL_TICK_EFFECT=PASS'
          for module in HitBox Notifications Macro1 NameHider NoJumpDelay NoHitDelay NoHurtCam Tracers AutoTool; do
            grep -Fq "category-lifecycle-probe-module-pass:$module:" "$STAGE"
          done
          grep -Fq 'category-lifecycle-probe-hitbox-border:opposite:enabled=true:' "$STAGE"
          grep -Fq 'category-lifecycle-probe-hitbox-border:restored:enabled=false:' "$STAGE"
          grep -Fq 'category-lifecycle-probe-hitbox-effect-pass:delta=0.35' "$STAGE"
          echo 'PRODUCTION_WORLD_HITBOX_ASM_COLLISION_EFFECT=PASS'
          grep -Fq 'category-lifecycle-probe-namehider-effect-pass:opposite:enabled=true:alias=' "$STAGE"
          grep -Fq 'category-lifecycle-probe-namehider-effect-pass:restored:enabled=false:alias=' "$STAGE"
          echo 'PRODUCTION_WORLD_NAMEHIDER_TRANSFORM_EFFECT=PASS'
          grep -Fq 'command-runtime-probe-fullbright-original:enabled=false:gamma=' "$STAGE"
          grep -Fq 'command-runtime-probe-toggle-request:FullBright:' "$STAGE"
          grep -Fq 'command-runtime-probe-toggle-pass:FullBright:enabled=true' "$STAGE"
          grep -Fq 'command-runtime-probe-fullbright-effect-pass:enabled=true:gamma=15.0' "$STAGE"
          grep -Fq 'command-runtime-probe-restore-request:FullBright:' "$STAGE"
          grep -Fq 'command-runtime-probe-fullbright-restore-pass:enabled=false:gamma=' "$STAGE"
          grep -Fq 'command-runtime-probe-pass:commands=7:' "$STAGE"
          echo 'PRODUCTION_WORLD_FULLBRIGHT_GAMMA_EFFECT=PASS'
          grep -Fq 'network-command-probe-ready:CommandLine:original=' "$STAGE"
          grep -Fq 'network-command-probe-pass:CommandLine:restored=' "$STAGE"
          grep -Fq 'command-intercept:.help' "$NETWORK_STAGE"
          grep -Fq 'command-intercept-dispatch:true:.help' "$NETWORK_STAGE"
          if grep -Fq '.help' "$RUNNER_TEMP/openabyss-production-world-server.log"; then
            echo 'Typed .help leaked to production local server.'
            exit 1
          fi
          for mode in STUDIO RAVEN VESTIGE; do
            grep -Fq "clickgui-mode-probe-open:$mode:" "$STAGE"
            grep -Fq "clickgui-mode-probe-close:$mode" "$STAGE"
          done
          grep -Fq 'clickgui-font-ready' "$STAGE"
          grep -Fq 'clickgui-mode-probe-pass:3:restored=' "$STAGE"
          grep -Fq 'clickgui-open-success:' "$STAGE"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_EXPLICIT_COREMOD_PROPERTY=0' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_INSTALL_MODE=mods-folder' "$STDOUT"
          test -s "$SCREENSHOT"

          SOURCE_HASH="$(sha256sum "$OPENABYSS_PRODUCTION_WORLD_JAR" | awk '{print toupper($1)}')"
          MOD_HASH="$(sha256sum "$GAME/mods/abyss.jar" | awk '{print toupper($1)}')"
          test "$SOURCE_HASH" = "$MOD_HASH"

          EVIDENCE="$GITHUB_WORKSPACE/production-world-evidence"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          cp -a "$GAME/." "$EVIDENCE/game"
          cp "$RUNNER_TEMP/openabyss-production-world-client.stdout.log" "$EVIDENCE/"
          cp "$RUNNER_TEMP/openabyss-production-world-client.stderr.log" "$EVIDENCE/"
          cp "$RUNNER_TEMP/openabyss-production-world-server.log" "$EVIDENCE/"
          cp "$RUNNER_TEMP/openabyss-production-world-glxinfo.txt" "$EVIDENCE/"
          cp "$SCREENSHOT" "$EVIDENCE/"
          cp "$RUNNER_TEMP"/openabyss-production-world-clickgui-mode-*.png "$EVIDENCE/"
          cp "$OPENABYSS_PRODUCTION_WORLD_PACKAGE/BUILD-INFO.txt" "$EVIDENCE/"

          grep -Fq 'world-session-join:1' "$STAGE"
          grep -Fq 'world-session-exit:1' "$STAGE"
          grep -Fq 'world-session-menu-cleanup:1:packetBuffer=false:u=0:v=0:a=0' "$STAGE"
          grep -Fq 'world-session-join:2' "$STAGE"
          grep -Fq 'world-session-lifecycle-complete:2' "$STAGE"
          grep -Fq 'world-session-heartbeat:2:300' "$STAGE"
          LOGIN_COUNT="$(grep -Ec 'CIProdWorld.*logged in with entity id' "$RUNNER_TEMP/openabyss-production-world-server.log" || true)"
          test "$LOGIN_COUNT" -ge 2
          echo 'PRODUCTION_WORLD_SAME_PROCESS_RECONNECT_CONTRACT=PASS sessions=2'

          echo 'PRODUCTION_WORLD_SHIPPED_JAR_HASH_CONTRACT=PASS'
          echo 'OPENABYSS_LINUX_PRODUCTION_WORLD_RUNTIME_SMOKE=PASS'

      - name: Upload production world runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAbyss-linux-production-world-runtime-smoke
          path: |
            production-world-evidence/**
            ${{ runner.temp }}/openabyss-production-world-game/logs/**
            ${{ runner.temp }}/openabyss-production-world-game/crash-reports/**
            ${{ runner.temp }}/openabyss-production-world-game/abyss-*.txt
            ${{ runner.temp }}/openabyss-production-world-game/abyss-*.tsv
            ${{ runner.temp }}/openabyss-production-world-game/mods/abyss.jar
            ${{ runner.temp }}/openabyss-production-world-client.stdout.log
            ${{ runner.temp }}/openabyss-production-world-client.stderr.log
            ${{ runner.temp }}/openabyss-production-world-server.log
            ${{ runner.temp }}/openabyss-production-world-glxinfo.txt
            ${{ runner.temp }}/openabyss-production-world-jstack.txt
            ${{ runner.temp }}/openabyss-production-world-jstack-2.txt
            ${{ runner.temp }}/openabyss-production-world-jstack-3.txt
            ${{ runner.temp }}/openabyss-production-world-stall.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-exit-fail.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-menu.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-join-fail.png
            ${{ runner.temp }}/openabyss-production-world-before-clickgui.png
            ${{ runner.temp }}/openabyss-production-world-clickgui-mode-*.png
            ${{ runner.temp }}/openabyss-production-world-clickgui.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Xvfb/Openbox
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "$OPENABYSS_OPENBOX_PID" ]; then kill "$OPENABYSS_OPENBOX_PID" 2>/dev/null || true; fi
          if [ -n "$OPENABYSS_XVFB_PID" ]; then kill "$OPENABYSS_XVFB_PID" 2>/dev/null || true; fi

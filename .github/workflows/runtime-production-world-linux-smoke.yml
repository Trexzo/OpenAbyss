          echo 'PRODUCTION_WORLD_FULLBRIGHT_GAMMA_EFFECT=PASS'
          grep -Fq 'network-command-probe-ready:CommandLine:original=' "$STAGE"
          grep -Fq 'network-command-probe-pass:CommandLine:restored=' "$STAGE"

name: OpenAbyss Linux Production World Runtime Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - recovery/r38-compile-pass
    paths:
      - .github/workflows/runtime-production-world-linux-smoke.yml
      - src/main/java/Abyss/**
      - src/main/java/com/formdev/flatlaf/**
      - src/main/resources/**
      - launcher/**
      - tools/production_forge_linux.py
      - tools/run_production_world_smoke.sh
      - build.gradle

permissions:
  contents: read

concurrency:
  group: openabyss-linux-production-world-runtime-smoke
  cancel-in-progress: true

jobs:
  linux-production-world-runtime:
    name: Production reobf JAR / normal Forge / local world / RSHIFT
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout recovery source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Temurin JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install graphics and network-isolation runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb mesa-utils x11-xserver-utils x11-utils xdotool openbox scrot imagemagick \
            libgl1-mesa-dri libglx-mesa0 \
            libx11-6 libxext6 libxrender1 libxtst6 libxi6 \
            libxrandr2 libxinerama1 libxcursor1 libxxf86vm1 \
            iproute2 util-linux

      - name: Install Gradle 2.14.1
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$RUNNER_TEMP/gradle-2.14.1-bin.zip"
          HOME_DIR="$RUNNER_TEMP/gradle-2.14.1"
          USER_HOME="$RUNNER_TEMP/gradle-user-home-production-world"
          rm -f "$ZIP"
          curl -L --fail --silent --show-error \
            --retry 6 --retry-delay 2 --retry-max-time 90 --retry-all-errors \
            'https://services.gradle.org/distributions/gradle-2.14.1-bin.zip' \
            -o "$ZIP"
          test -s "$ZIP"
          unzip -tq "$ZIP" >/dev/null
          unzip -q -o "$ZIP" -d "$RUNNER_TEMP"
          GRADLE="$HOME_DIR/bin/gradle"
          test -x "$GRADLE"
          echo "OPENABYSS_GRADLE=$GRADLE" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$USER_HOME" >> "$GITHUB_ENV"
          "$GRADLE" --version

      - name: Build exact shipped production package
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/production_forge_linux.py
          bash -n tools/run_production_world_smoke.sh

          build_ok=0
          for attempt in 1 2 3; do
            echo "PRODUCTION_WORLD_BUILD_ATTEMPT=$attempt"
            if "$OPENABYSS_GRADLE" --no-daemon clean packageWindowsLauncher; then
              build_ok=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done
          if [ "$build_ok" -ne 1 ]; then
            echo "PRODUCTION_WORLD_BUILD_RETRIES_EXHAUSTED=1" >&2
            exit 1
          fi

          PACKAGE="$GITHUB_WORKSPACE/build/distributions/OpenAbyss-Windows-Launcher.zip"
          OUT="$RUNNER_TEMP/openabyss-production-world-package"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          unzip -q "$PACKAGE" -d "$OUT"

          test -s "$OUT/abyss.jar"
          test -s "$OUT/BUILD-INFO.txt"
          JAR_HASH="$(sha256sum "$OUT/abyss.jar" | awk '{print toupper($1)}')"
          INFO_HASH="$(grep '^JAR_SHA256=' "$OUT/BUILD-INFO.txt" | cut -d= -f2- | tr '[:lower:]' '[:upper:]')"
          test "$JAR_HASH" = "$INFO_HASH"

          echo "OPENABYSS_PRODUCTION_WORLD_PACKAGE=$OUT" >> "$GITHUB_ENV"
          echo "OPENABYSS_PRODUCTION_WORLD_JAR=$OUT/abyss.jar" >> "$GITHUB_ENV"
          echo "PRODUCTION_WORLD_SHIPPED_JAR_SHA256=$JAR_HASH"

      - name: Prepare normal Forge profile, official assets, and local server
        shell: bash
        run: |
          set -euo pipefail
          MC="$RUNNER_TEMP/openabyss-production-world-minecraft"
          rm -rf "$MC"
          python tools/production_forge_linux.py prepare \
            --minecraft-dir "$MC" \
            --download-assets

          grep -Fq 'OPENABYSS_PRODUCTION_FORGE_PROFILE=READY' "$MC/openabyss-production-profile.txt"
          cat "$MC/openabyss-production-profile.txt"
          echo "OPENABYSS_PRODUCTION_WORLD_MC=$MC" >> "$GITHUB_ENV"

          SERVER_JAR="$RUNNER_TEMP/minecraft_server.1.8.9.jar"
          python - "$SERVER_JAR" <<'PY'
          import hashlib, json, sys, urllib.request
          output = sys.argv[1]
          manifest = json.load(urllib.request.urlopen(
              'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',
              timeout=30,
          ))
          entry = next(v for v in manifest['versions'] if v['id'] == '1.8.9')
          version = json.load(urllib.request.urlopen(entry['url'], timeout=30))
          server = version['downloads']['server']
          with urllib.request.urlopen(server['url'], timeout=60) as response:
              data = response.read()
          actual = hashlib.sha1(data).hexdigest()
          if actual.lower() != server['sha1'].lower():
              raise SystemExit('SERVER_SHA1_MISMATCH expected=%s actual=%s' % (server['sha1'], actual))
          open(output, 'wb').write(data)
          print('MINECRAFT_SERVER_1_8_9_SHA1=' + actual.upper())
          print('MINECRAFT_SERVER_1_8_9_BYTES=' + str(len(data)))
          PY
          test -s "$SERVER_JAR"
          echo "OPENABYSS_SERVER_JAR=$SERVER_JAR" >> "$GITHUB_ENV"

      - name: Start Mesa X server
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset \
            >"$RUNNER_TEMP/openabyss-production-world-xvfb.log" 2>&1 &
          echo "OPENABYSS_XVFB_PID=$!" >> "$GITHUB_ENV"

          for _ in $(seq 1 30); do
            if DISPLAY=:99 xdpyinfo >/dev/null 2>&1; then break; fi
            sleep 1
          done
          DISPLAY=:99 xdpyinfo >/dev/null

          DISPLAY=:99 openbox >"$RUNNER_TEMP/openabyss-production-world-openbox.log" 2>&1 &
          echo "OPENABYSS_OPENBOX_PID=$!" >> "$GITHUB_ENV"
          sleep 2

          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | tee "$RUNNER_TEMP/openabyss-production-world-glxinfo.txt"
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B | grep -Eq 'OpenGL renderer string:.*(llvmpipe|softpipe|Mesa)'
          echo 'PRODUCTION_WORLD_MESA=PASS'

      - name: Run shipped production JAR with no external network
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/run_production_world_smoke.sh

          RUNNER_UID="$(id -u)"
          RUNNER_GID="$(id -g)"

          sudo unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            ip link add abyss-dummy type dummy
            ip addr add 192.0.2.1/32 dev abyss-dummy
            ip link set abyss-dummy up
            test -z "$(ip route show default)"

            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env \
                HOME="$3" \
                DISPLAY=:99 \
                JAVA_HOME="$4" \
                PATH="$4/bin:$5" \
                GITHUB_WORKSPACE="$6" \
                RUNNER_TEMP="$7" \
                OPENABYSS_SERVER_JAR="$8" \
                OPENABYSS_PRODUCTION_WORLD_MC="$9" \
                OPENABYSS_PRODUCTION_WORLD_JAR="${10}" \
                LIBGL_ALWAYS_SOFTWARE=1 \
                GITHUB_TOKEN= \
                ACTIONS_RUNTIME_TOKEN= \
                ACTIONS_ID_TOKEN_REQUEST_TOKEN= \
                ACTIONS_ID_TOKEN_REQUEST_URL= \
                ABYSS_PAYLOAD_KEY= \
                bash "$6/tools/run_production_world_smoke.sh"
          ' _ \
            "$RUNNER_UID" "$RUNNER_GID" "$HOME" "$JAVA_HOME" "$PATH" \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP" "$OPENABYSS_SERVER_JAR" \
            "$OPENABYSS_PRODUCTION_WORLD_MC" "$OPENABYSS_PRODUCTION_WORLD_JAR"

      - name: Validate and stage production-world evidence
        shell: bash
        run: |
          set -euo pipefail
          GAME="$RUNNER_TEMP/openabyss-production-world-game"
          STAGE="$GAME/abyss-runtime-stage.txt"
          STDOUT="$RUNNER_TEMP/openabyss-production-world-client.stdout.log"
          SCREENSHOT="$RUNNER_TEMP/openabyss-production-world-clickgui.png"

          test -f "$STAGE"
          test -f "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG_COUNT=69' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.worldFunctionalProbe=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe13=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe14=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe15=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe16=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe17=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe18=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe19=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe20=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe21=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe22=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe23=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe24=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe25=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe26=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe27=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe28=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe29=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe30=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe31=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe32=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe33=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe34=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe35=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe36=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe37=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe38=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe39=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe40=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe41=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe42=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe43=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe44=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe45=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe46=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe47=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe48=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe49=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe50=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe51=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe52=true' "$STDOUT"
          grep -Fq 'OPENABYSS_PRODUCTION_LINUX_JVM_ARG=-Dabyss.highRiskFunctionalProbe53=true' "$STDOUT"
          echo 'PRODUCTION_WORLD_EXPLICIT_JVM_PROBES=PASS count=69'
          grep -Fq 'menu-no-world-tick' "$STAGE"
          grep -Fq 'menu-cleanup-complete:packetBuffer=false:u=0:v=0:a=0' "$STAGE"
          echo 'PRODUCTION_WORLD_MENU_LIFECYCLE=PASS'
          echo 'PRODUCTION_WORLD_MENU_PACKET_CLEANUP=PASS'
          grep -Fq 'entity-player-join-world' "$STAGE"
          grep -Fq 'world-ready-tick' "$STAGE"
          grep -Fq 'world-module-lifecycle-complete' "$STAGE"
          NETWORK_STAGE="$GAME/abyss-network-stage.txt"
          test -f "$NETWORK_STAGE"
          grep -Fq 'send-hook:' "$NETWORK_STAGE"
          grep -Fq 'receive-hook:' "$NETWORK_STAGE"
          grep -Fq 'world-functional-probe-pass' "$STAGE"
          grep -Fq 'category-lifecycle-probe-pass:9' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Velocity' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:NoSlow' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Blink' "$STAGE"
          grep -Fq 'high-risk-functional-probe-module-pass:Speed' "$STAGE"
          grep -Fq 'high-risk-functional-probe-pass:4' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL=PASS modules=Velocity,NoSlow,Blink,Speed'
          grep -Fq 'high-risk-functional-probe2-module-pass:Sprint' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-module-pass:BackTrack' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-module-pass:NoInteract' "$STAGE"
          grep -Fq 'high-risk-functional-probe2-pass:3' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL2=PASS modules=Sprint,BackTrack,NoInteract'
          grep -Fq 'physical-input-functional-probe-effect-pass:AutoClicker:physicalAttack=true' "$STAGE"
          grep -Fq 'physical-input-functional-probe-effect-pass:FastFall:motionY=' "$STAGE"
          grep -Fq 'physical-input-functional-probe-pass:2' "$STAGE"
          echo 'PRODUCTION_WORLD_PHYSICAL_INPUT_FUNCTIONAL=PASS modules=AutoClicker,FastFall'
          grep -Fq 'high-risk-functional-probe3-effect-pass:WTap:forward=0.0:strafe=0.0' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-restore-pass:WTap' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-module-pass:WTap' "$STAGE"
          grep -Fq 'high-risk-functional-probe3-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL3=PASS modules=WTap'
          grep -Fq 'high-risk-functional-probe4-effect-pass:ChestESP:visible=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-effect-pass:ChestESP:ignoreOpened=true:hidden=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-restore-pass:ChestESP' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-module-pass:ChestESP' "$STAGE"
          grep -Fq 'high-risk-functional-probe4-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL4=PASS modules=ChestESP'
          grep -Fq 'invmove-physical-probe-input-seen:inventory=true' "$STAGE"
          grep -Fq 'invmove-physical-probe-container-open:' "$STAGE"
          grep -Fq 'invmove-physical-probe-input-seen:forward=true' "$STAGE"
          grep -Fq 'invmove-physical-probe-effect-pass:forwardBinding=true:screen=' "$STAGE"
          grep -Fq 'invmove-physical-probe-close-effect-pass:forwardBinding=false' "$STAGE"
          grep -Fq 'invmove-physical-probe-restore-pass:' "$STAGE"
          grep -Fq 'invmove-physical-probe-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_INVMOVE_PHYSICAL=PASS input=real-E-plus-W'
          grep -Fq 'high-risk-functional-probe5-effect-pass:AntiDebuff:disabled:blindnessVisible=true:confusionVisible=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe5-effect-pass:AntiDebuff:enabled:blindnessVisible=false:confusionVisible=false' "$STAGE"
          grep -Fq 'high-risk-functional-probe5-restore-pass:AntiDebuff:' "$STAGE"
          grep -Fq 'high-risk-functional-probe5-module-pass:AntiDebuff' "$STAGE"
          grep -Fq 'high-risk-functional-probe5-pass:1' "$STAGE"
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL5=PASS modules=AntiDebuff'
          grep -Fq 'high-risk-functional-probe6-effect-pass:NoHurtCam:disabled:identityDelta=' "$STAGE"
          grep -Fq 'high-risk-functional-probe6-effect-pass:NoHurtCam:enabled:identityDelta=0.0:effect=0' "$STAGE"
          grep -Fq 'high-risk-functional-probe6-restore-pass:NoHurtCam:' "$STAGE"
          grep -Fq 'high-risk-functional-probe6-module-pass:NoHurtCam' "$STAGE"
          grep -Fq 'high-risk-functional-probe6-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe6-fail:' "$STAGE"; then
            echo 'NoHurtCam renderer-hook probe reported a failure.'
            grep -F 'high-risk-functional-probe6-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL6=PASS modules=NoHurtCam'
          grep -Fq 'high-risk-functional-probe7-effect-pass:BarrierVisible:disabled:cancelled=false:returnValue=71' "$STAGE"
          grep -Fq 'high-risk-functional-probe7-effect-pass:BarrierVisible:enabled:cancelled=true:returnValue=3' "$STAGE"
          grep -Fq 'high-risk-functional-probe7-restore-pass:BarrierVisible:' "$STAGE"
          grep -Fq 'high-risk-functional-probe7-module-pass:BarrierVisible' "$STAGE"
          grep -Fq 'high-risk-functional-probe7-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe7-fail:' "$STAGE"; then
            echo 'BarrierVisible render-type hook probe reported a failure.'
            grep -F 'high-risk-functional-probe7-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL7=PASS modules=BarrierVisible'
          grep -Fq 'high-risk-functional-probe8-effect-pass:ViewClip:disabled:takeover=false:result=null' "$STAGE"
          grep -Fq 'high-risk-functional-probe8-effect-pass:ViewClip:enabled:takeover=true:result=' "$STAGE"
          grep -Fq 'high-risk-functional-probe8-restore-pass:ViewClip:' "$STAGE"
          grep -Fq 'high-risk-functional-probe8-module-pass:ViewClip' "$STAGE"
          grep -Fq 'high-risk-functional-probe8-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe8-fail:' "$STAGE"; then
            echo 'ViewClip camera-hook probe reported a failure.'
            grep -F 'high-risk-functional-probe8-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL8=PASS modules=ViewClip'
          grep -Fq 'high-risk-functional-probe9-effect-pass:Animations:disabled:cancelled=false:noRotations=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe9-effect-pass:Animations:enabled:cancelled=true:noRotations=true' "$STAGE"
          grep -Fq 'high-risk-functional-probe9-restore-pass:Animations:' "$STAGE"
          grep -Fq 'high-risk-functional-probe9-module-pass:Animations' "$STAGE"
          grep -Fq 'high-risk-functional-probe9-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe9-fail:' "$STAGE"; then
            echo 'Animations item-renderer hook probe reported a failure.'
            grep -F 'high-risk-functional-probe9-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL9=PASS modules=Animations'
          grep -Fq 'high-risk-functional-probe10-baseline-pass:Timer:timerSpeed=' "$STAGE"
          grep -Fq 'high-risk-functional-probe10-effect-pass:Timer:enabled:timerSpeed=1.37' "$STAGE"
          grep -Fq 'high-risk-functional-probe10-effect-pass:Timer:disabled:timerSpeed=' "$STAGE"
          grep -Fq 'high-risk-functional-probe10-restore-pass:Timer:' "$STAGE"
          grep -Fq 'high-risk-functional-probe10-module-pass:Timer' "$STAGE"
          grep -Fq 'high-risk-functional-probe10-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe10-fail:' "$STAGE"; then
            echo 'Timer Render2D speed/restoration probe reported a failure.'
            grep -F 'high-risk-functional-probe10-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL10=PASS modules=Timer'
          grep -Fq 'high-risk-functional-probe11-effect-pass:Chams:disabled:pre=false:post=false' "$STAGE"
          grep -Fq 'high-risk-functional-probe11-effect-pass:Chams:enabled:pre=true:post=false' "$STAGE"
          grep -Fq 'high-risk-functional-probe11-effect-pass:Chams:restored:' "$STAGE"
          grep -Fq 'high-risk-functional-probe11-restore-pass:Chams:' "$STAGE"
          grep -Fq 'high-risk-functional-probe11-module-pass:Chams' "$STAGE"
          grep -Fq 'high-risk-functional-probe11-pass:1' "$STAGE"
          if grep -Fq 'high-risk-functional-probe11-fail:' "$STAGE"; then
            echo 'Chams PreRender/PostRender polygon-offset probe reported a failure.'
            grep -F 'high-risk-functional-probe11-' "$STAGE" || true
            exit 1
          fi
          echo 'PRODUCTION_WORLD_HIGH_RISK_FUNCTIONAL11=PASS modules=Chams'
          grep -Fq 'high-risk-functional-probe12-effect-pass:Freelook:enabled:view=1:active=true:yaw=37.25:pitch=-18.5' "$STAGE"
          grep -Fq 'high-risk-functional-probe12-effect-pass:Freelook:disabled:view=0:active=false:yaw=37.25:pitch=-18.5' "$STAGE"

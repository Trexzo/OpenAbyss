          grep -Fq 'world-session-join:2' "$STAGE"
          grep -Fq 'world-session-lifecycle-complete:2' "$STAGE"
          grep -Fq 'world-session-heartbeat:2:300' "$STAGE"
          LOGIN_COUNT="$(grep -Ec 'CIProdWorld.*logged in with entity id' "$RUNNER_TEMP/openabyss-production-world-server.log" || true)"
          test "$LOGIN_COUNT" -ge 2
          echo 'PRODUCTION_WORLD_SAME_PROCESS_RECONNECT_CONTRACT=PASS sessions=2'

          echo 'PRODUCTION_WORLD_SHIPPED_JAR_HASH_CONTRACT=PASS'
          echo 'OPENABYSS_LINUX_PRODUCTION_WORLD_RUNTIME_SMOKE=PASS'

      - name: Upload production world runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenAbyss-linux-production-world-runtime-smoke
          path: |
            production-world-evidence/**
            ${{ runner.temp }}/openabyss-production-world-game/logs/**
            ${{ runner.temp }}/openabyss-production-world-game/crash-reports/**
            ${{ runner.temp }}/openabyss-production-world-game/abyss-*.txt
            ${{ runner.temp }}/openabyss-production-world-game/abyss-*.tsv
            ${{ runner.temp }}/openabyss-production-world-game/mods/abyss.jar
            ${{ runner.temp }}/openabyss-production-world-client.stdout.log
            ${{ runner.temp }}/openabyss-production-world-client.stderr.log
            ${{ runner.temp }}/openabyss-production-world-server.log
            ${{ runner.temp }}/openabyss-production-world-glxinfo.txt
            ${{ runner.temp }}/openabyss-production-world-jstack.txt
            ${{ runner.temp }}/openabyss-production-world-jstack-2.txt
            ${{ runner.temp }}/openabyss-production-world-jstack-3.txt
            ${{ runner.temp }}/openabyss-production-world-stall.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-exit-fail.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-menu.png
            ${{ runner.temp }}/openabyss-production-world-reconnect-join-fail.png
            ${{ runner.temp }}/openabyss-production-world-before-clickgui.png
            ${{ runner.temp }}/openabyss-production-world-clickgui-mode-*.png
            ${{ runner.temp }}/openabyss-production-world-clickgui.png
          if-no-files-found: warn
          retention-days: 7

      - name: Stop Xvfb/Openbox
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "$OPENABYSS_OPENBOX_PID" ]; then kill "$OPENABYSS_OPENBOX_PID" 2>/dev/null || true; fi
          if [ -n "$OPENABYSS_XVFB_PID" ]; then kill "$OPENABYSS_XVFB_PID" 2>/dev/null || true; fi
